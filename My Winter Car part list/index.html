<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Winter Car Rivett Part Checker</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="page-wrap">

    <!-- ── Header ─────────────────────────── -->
    <header class="site-header">
      <div class="header-top">
        <div class="header-title">
          <div>
            <h1>My Winter Car Rivett Part Checker</h1>
            <p class="subtitle">Parts Assembly Checklist</p>
          </div>
        </div>

        <!-- Global progress -->
        <div class="global-progress-box">
          <div class="global-progress-label">
            <span>Overall Progress</span>
            <span id="global-fraction">0 / 0</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="global-bar"></div>
          </div>
          <div class="global-pct" id="global-pct">0%</div>
        </div>
      </div>
    </header>

    <!-- ── Sticky Bar ─────────────────────── -->
    <div class="sticky-bar">
      <!-- Search bar -->
      <div class="search-box">
        <input type="text" id="part-search" placeholder="Search parts..." autocomplete="off" />
      </div>

      <div class="filters-and-controls">
        <!-- Attribute Filters -->
        <div class="attr-filters">
          <label class="filter-cb"><input type="checkbox" id="filter-damage"> Damageable</label>
          <label class="filter-cb"><input type="checkbox" id="filter-paint"> Paintable</label>
        </div>

        <!-- Transmission filter -->
        <div class="tx-filter">
          <button class="tx-btn active" data-tx="all">All Tx</button>
          <button class="tx-btn" data-tx="manual">Manual</button>
          <button class="tx-btn" data-tx="auto">Auto</button>
        </div>

        <!-- Controls -->
        <div class="header-controls">
          <button class="ctrl-btn" id="btn-expand">Expand All</button>
          <button class="ctrl-btn" id="btn-collapse">Collapse All</button>
          <button class="ctrl-btn danger" id="btn-reset">Reset All</button>
        </div>
      </div>
    </div>

    <!-- ── Content ────────────────────────── -->
    <main id="main-content"></main>

  </div>

  
  <script src="script.js"></script>
</body>
</html>
