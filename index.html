<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Project Hub</title>
    <link rel="stylesheet" href="hub_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">
            <span class="icon">☀</span> <span class="text">Light Mode</span>
        </button>
        <h1>My Projects</h1>
        <p class="subtitle">A collection of web experiments and applications</p>
    </header>

    <main>
        <div id="project-container" class="project-grid">
            <div class="loader">Loading projects...</div>
        </div>
    </main>

    <footer>
        <p>Generated automatically via GitHub API</p>
    </footer>

    <script>
        const BLACKLIST = ['.git', '.github', 'assets', 'img', 'css', 'js', 'node_modules'];
        const EXTERNAL_PROJECTS = [
            {
                name: '2ite-web-machac-vit',
                url: 'https://spagy69.github.io/2ite-web-machac-vit/',
                repo: 'Spagy69/2ite-web-machac-vit'
            }
        ];

        // Theme Handling
        const toggleButton = document.getElementById('theme-toggle');
        const body = document.body;
        const iconSpan = toggleButton.querySelector('.icon');
        const textSpan = toggleButton.querySelector('.text');

        function updateButton(isLight) {
            if (isLight) {
                iconSpan.textContent = '☾';
                textSpan.textContent = 'Dark Mode';
            } else {
                iconSpan.textContent = '☀';
                textSpan.textContent = 'Light Mode';
            }
        }

        // Check Local Storage
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            body.classList.add('light-mode');
            updateButton(true);
        } else {
            // Default is dark
            updateButton(false);
        }

        toggleButton.addEventListener('click', () => {
            body.classList.toggle('light-mode');
            const isLight = body.classList.contains('light-mode');
            updateButton(isLight);
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        });

        async function fetchProjects() {
            const container = document.getElementById('project-container');

            try {
                // Determine the repository from the URL
                const hostname = window.location.hostname;
                const path = window.location.pathname.split('/').filter(p => p);

                let username, repo;

                if (hostname.includes('github.io')) {
                    username = hostname.split('.')[0];
                    repo = path[0] || '';
                }

                // Initialize with external projects
                let allProjects = EXTERNAL_PROJECTS.map(p => ({
                    ...p,
                    isExternal: true
                }));

                // If hosted on GitHub, try to fetch siblings
                if (username) {
                    const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/`;
                    try {
                        const response = await fetch(apiUrl);
                        if (response.ok) {
                            const data = await response.json();
                            const subdirs = data.filter(item =>
                                item.type === 'dir' &&
                                !item.name.startsWith('.') &&
                                !BLACKLIST.includes(item.name.toLowerCase())
                            ).map(p => ({
                                name: p.name,
                                url: `./${p.name}/`,
                                repo: `${username}/${repo}`,
                                isExternal: false
                            }));
                            allProjects = [...allProjects, ...subdirs];
                        }
                    } catch (e) {
                        console.warn('Could not fetch repo contents', e);
                    }
                }

                if (allProjects.length === 0) {
                    container.innerHTML = `
                        <div class="project-card" style="grid-column: 1/-1; height: auto;">
                            <div class="project-title">Local Mode Detected</div>
                            <p class="project-desc">Auto-discovery works best when hosted on GitHub Pages.<br>
                            If you are viewing this locally, only hardcoded projects are visible.</p>
                        </div>
                     `;
                    return;
                }

                // Helper to get last commit date
                async function getLastCommitDate(project) {
                    const targetRepo = project.repo || `${username}/${repo}`;
                    const cacheKey = `last_commit_${targetRepo}_${project.isExternal ? 'root' : project.name}`;

                    const cached = localStorage.getItem(cacheKey);
                    if (cached) {
                        const { date, timestamp } = JSON.parse(cached);
                        if (Date.now() - timestamp < 15 * 60 * 1000) {
                            return new Date(date);
                        }
                    }

                    try {
                        let commitsUrl = `https://api.github.com/repos/${targetRepo}/commits?per_page=1`;
                        // Only add path filter for internal sub-projects
                        if (!project.isExternal) {
                            commitsUrl += `&path=${project.name}`;
                        }

                        const res = await fetch(commitsUrl);
                        if (!res.ok) return new Date(0);
                        const commits = await res.json();
                        if (commits.length > 0) {
                            const dateStr = commits[0].commit.committer.date;
                            localStorage.setItem(cacheKey, JSON.stringify({
                                date: dateStr,
                                timestamp: Date.now()
                            }));
                            return new Date(dateStr);
                        }
                    } catch (e) {
                        console.error(`Failed to fetch date for ${project.name}`, e);
                    }
                    return new Date(0);
                }

                container.innerHTML = '<div class="loader">Sorting projects by recent updates...</div>';

                const projectsWithDates = await Promise.all(allProjects.map(async (p) => {
                    const date = await getLastCommitDate(p);
                    return { ...p, lastUpdated: date };
                }));

                projectsWithDates.sort((a, b) => b.lastUpdated - a.lastUpdated);

                container.innerHTML = '';

                projectsWithDates.forEach(project => {
                    const card = document.createElement('a');
                    card.href = project.url;
                    card.className = 'project-card';
                    if (project.isExternal) card.target = "_blank";

                    const namePretty = project.name.replace(/-/g, ' ').replace(/_/g, ' ');

                    const dateStr = project.lastUpdated.getTime() > 0
                        ? project.lastUpdated.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' })
                        : '';

                    card.innerHTML = `
                        <div class="project-icon">📂</div>
                        <div class="project-title">${namePretty}</div>
                        <div class="project-desc">
                             ${dateStr ? `<span style="font-size: 0.8em; opacity: 0.8; display:block; margin-bottom:4px;">Updated: ${dateStr}</span>` : ''}
                             Click to view project
                        </div>
                    `;

                    container.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                container.innerHTML = `<div class="error-message">Error loading projects: ${error.message}</div>`;
            }
        }

        // Wait to fetch projects
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', fetchProjects);
        } else {
            fetchProjects();
        }
    </script>
</body>

</html>
