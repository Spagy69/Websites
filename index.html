<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Project Hub</title>
    <link rel="stylesheet" href="hub_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">
            <span class="icon">☀</span> <span class="text">Light Mode</span>
        </button>
        <h1>My Projects</h1>
        <p class="subtitle">A collection of web experiments and applications</p>
    </header>

    <main>
        <div id="project-container" class="project-grid">
            <div class="loader">Loading projects...</div>
        </div>
    </main>

    <footer>
        <p>Generated automatically via GitHub API</p>
    </footer>

    <script>
        const BLACKLIST = ['.git', '.github', 'assets', 'img', 'css', 'js', 'node_modules'];

        // Theme Handling
        const toggleButton = document.getElementById('theme-toggle');
        const body = document.body;
        const iconSpan = toggleButton.querySelector('.icon');
        const textSpan = toggleButton.querySelector('.text');

        function updateButton(isLight) {
            if (isLight) {
                iconSpan.textContent = '☾';
                textSpan.textContent = 'Dark Mode';
            } else {
                iconSpan.textContent = '☀';
                textSpan.textContent = 'Light Mode';
            }
        }

        // Check Local Storage
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            body.classList.add('light-mode');
            updateButton(true);
        } else {
            // Default is dark
            updateButton(false);
        }

        toggleButton.addEventListener('click', () => {
            body.classList.toggle('light-mode');
            const isLight = body.classList.contains('light-mode');
            updateButton(isLight);
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        });

        async function fetchProjects() {
            const container = document.getElementById('project-container');

            try {
                // Determine the repository from the URL
                // Format: https://<username>.github.io/<repo-name>/
                // API URL: https://api.github.com/repos/<username>/<repo-name>/contents/

                const hostname = window.location.hostname;
                const path = window.location.pathname.split('/').filter(p => p);

                // Fallback for local testing (mock data or prompt)
                if (hostname === 'localhost' || hostname === '127.0.0.1') {
                    // For local testing, we can't easily auto-discover without a backend.
                    // We'll show a helpful message or try to infer.
                    console.warn("Running locally. GitHub API discovery relies on hostname parsing.");
                }

                let username, repo;

                if (hostname.includes('github.io')) {
                    username = hostname.split('.')[0];
                    repo = path[0] || '';
                } else {
                    // Start manually for testing/dev if needed
                }

                if (!username) {
                    container.innerHTML = `
                        <div class="project-card" style="grid-column: 1/-1; height: auto;">
                            <div class="project-title">Local Mode Detected</div>
                            <p class="project-desc">Auto-discovery works best when hosted on GitHub Pages.<br>
                            If you are viewing this locally, please open the individual project folders manually.</p>
                        </div>
                     `;
                    return;
                }

                const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/`;
                const response = await fetch(apiUrl);

                if (!response.ok) {
                    if (response.status === 403) throw new Error("API Rate Limit Exceeded. Try again later.");
                    if (response.status === 404) throw new Error("Repository not found.");
                    throw new Error("Failed to fetch projects.");
                }

                const data = await response.json();

                // Clear loader
                container.innerHTML = '';

                // Filter for directories
                let projects = data.filter(item =>
                    item.type === 'dir' &&
                    !item.name.startsWith('.') &&
                    !BLACKLIST.includes(item.name.toLowerCase())
                );

                if (projects.length === 0) {
                    container.innerHTML = '<div class="error-message">No projects found in this repository.</div>';
                    return;
                }

                // Helper to get last commit date
                async function getLastCommitDate(projectName) {
                    const cacheKey = `last_commit_${username}_${repo}_${projectName}`;
                    const cached = localStorage.getItem(cacheKey);

                    if (cached) {
                        const { date, timestamp } = JSON.parse(cached);
                        // Cache for 15 minutes
                        if (Date.now() - timestamp < 15 * 60 * 1000) {
                            return new Date(date);
                        }
                    }

                    try {
                        // Fetch the last commit for this path
                        const commitsUrl = `https://api.github.com/repos/${username}/${repo}/commits?path=${projectName}&per_page=1`;
                        const res = await fetch(commitsUrl);
                        if (!res.ok) return new Date(0); // If failed, treat as very old
                        const commits = await res.json();
                        if (commits.length > 0) {
                            const dateStr = commits[0].commit.committer.date;
                            localStorage.setItem(cacheKey, JSON.stringify({
                                date: dateStr,
                                timestamp: Date.now()
                            }));
                            return new Date(dateStr);
                        }
                    } catch (e) {
                        console.error(`Failed to fetch date for ${projectName}`, e);
                    }
                    return new Date(0);
                }

                // Fetch dates in parallel
                // We leave the loader removed (or could have kept it until now, but incremental might be better? 
                // Actually with async sorting, better to wait so the list doesn't jump).
                // Let's put a spinner back if it takes too long, or just wait.
                container.innerHTML = '<div class="loader">Sorting projects by recent updates...</div>';

                const projectsWithDates = await Promise.all(projects.map(async (p) => {
                    const date = await getLastCommitDate(p.name);
                    return { ...p, lastUpdated: date };
                }));

                // Sort descending
                projectsWithDates.sort((a, b) => b.lastUpdated - a.lastUpdated);

                // Clear loader again
                container.innerHTML = '';

                projectsWithDates.forEach(project => {
                    const card = document.createElement('a');
                    card.href = `./${project.name}/`;
                    card.className = 'project-card';
                    const namePretty = project.name.replace(/-/g, ' ').replace(/_/g, ' ');

                    // Format date
                    const dateStr = project.lastUpdated.getTime() > 0
                        ? project.lastUpdated.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' })
                        : '';

                    card.innerHTML = `
                        <div class="project-icon">📂</div>
                        <div class="project-title">${namePretty}</div>
                        <div class="project-desc">
                             ${dateStr ? `<span style="font-size: 0.8em; opacity: 0.8; display:block; margin-bottom:4px;">Updated: ${dateStr}</span>` : ''}
                             Click to view project
                        </div>
                    `;

                    container.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                container.innerHTML = `<div class="error-message">Error loading projects: ${error.message}</div>`;
            }
        }

        // Wait to fetch projects
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', fetchProjects);
        } else {
            fetchProjects();
        }
    </script>
</body>

</html>
