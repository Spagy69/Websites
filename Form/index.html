<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1>Formulář</h1>
    <form>
        <label>
            Email:
            <input type="email" name="email" value="@" required><br>
        </label>
        <label>
            Heslo
            <input type="password" name="password">
        </label>
        <br>
        <fieldset>
            <label>Muž: <input type="radio" name="pohlavi" value="Muž"></label><br>
            <label>Žena: <input type="radio" name="pohlavi" value="Muž"></label>
        </fieldset>
        <br>
        <fieldset>
        <label for="resolution">Rozlišení obrazovky:</label>
        <select name="resolution" id="resolution" size="3" multiple>
            <option value="1920x1080">1920x1080</option>
            <option value="2560x1440">2560x1440</option>
            <option value="1280x720">1280x720</option>
        </select>
        </fieldset>

        <br>
        <input type="submit" value="Odeslat">
    </form>
</body>
</html>
